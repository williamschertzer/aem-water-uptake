[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aemwater"
version = "0.1.0"
description = "Predict maximum water uptake in polymeric anion exchange membranes with LAMMPS molecular dynamics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "aem-water-uptake contributors" }]
keywords = ["molecular-dynamics", "lammps", "anion-exchange-membrane", "water-uptake", "gaff2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "tabulate",   # DataFrame.to_markdown() in the report
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
# rdkit / parmed / mdanalysis / ambertools / lammps come from conda (environment.yml).
# These extras only cover what is pip-installable.
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
aemwater = "aemwater.cli:main"

[project.urls]
Homepage = "https://github.com/USERNAME/aem-water-uptake"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aemwater = ["lammps/templates/*.j2", "forcefield/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "needs_lammps: requires a working lmp binary",
  "needs_ambertools: requires antechamber/parmchk2/tleap",
  "slow: takes more than ~30 s",
]
filterwarnings = ["ignore::DeprecationWarning"]
