name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # The toolchain is not pip-installable: RDKit, AmberTools and LAMMPS all
      # come from conda-forge. The test suite itself needs no LAMMPS binary --
      # runs are mocked -- but the writer tests compare against Amber energies,
      # so AmberTools is required.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: aem
          channels: conda-forge
          python-version: "3.11"

      - name: Install dependencies
        run: |
          conda install -y -c conda-forge rdkit ambertools parmed mdanalysis \
                                          numpy scipy matplotlib pandas pyyaml \
                                          jinja2 pytest pytest-cov tabulate
          pip install -e . --no-deps

      - name: Run tests
        run: pytest -v --cov=aemwater --cov-report=term-missing

      - name: Check the CLI is wired up
        run: |
          aemwater --help
          aemwater run --help
