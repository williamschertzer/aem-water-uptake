polymer:
  smiles: '[*]CC[*]'
  n_chains: 1
  chain_length: 1
  counterion: Cl-
  terminal_group: CH3
  charge_method: bcc
  name: AEM
box:
  initial_density: 0.2
  target_density: 1.1
  min_separation: 2.2
  seed: 20260817
  max_place_attempts: 400
md:
  temperature: 298.15
  pressure: 1.0
  timestep: 1.0
  cutoff: 10.0
  kspace_accuracy: 0.0001
  soft_push_steps: 20000
  anneal_steps: 50000
  anneal_temperature: 600.0
  compression_steps: 20000
  compression_pressure: 1000.0
  dry_npt_steps: 100000
  relax_npt_steps: 20000
  min_etol: 1.0e-06
  min_ftol: 1.0e-06
  min_maxiter: 20000
  thermo_every: 500
  dump_every: 0
  mpi_ranks: 1
  lammps_binary: null
  tdamp: 100.0
  pdamp: 1000.0
  seed: 87231
equilibration:
  scheme: 21step
  max_pressure: 50000.0
  high_temperature: 600.0
  time_scale: 1.0
  final_npt_ps: 800.0
  enforce_convergence: true
  expected_density: null
  density_tolerance: 0.05
  drift_tolerance: 0.002
insertion:
  batch_fraction: 0.25
  batch_size: 20
  min_batch_size: 2
  grid_spacing: 0.5
  probe_radius: 1.4
  water_water_min: 2.6
  vdw_scale: 1.0
  max_failed_batches: 3
  max_iterations: 60
  max_waters: 0
  seed: 5150
widom:
  enabled: true
  n_blocks: 5
  insertions_per_call: 400
  every: 100
  steps_per_block: 10000
  bulk_box_length: 25.0
  bulk_equil_steps: 50000
  sigma_tolerance: 1.0
  cache_dir: ~/.cache/aemwater
  seed: 31337
fep:
  n_morphologies: 10
  lj_lambdas:
  - 0.0
  - 0.1
  - 0.2
  - 0.35
  - 0.5
  - 0.65
  - 0.8
  - 1.0
  coul_lambdas:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
  soft_core_n: 1
  alpha_lj: 0.5
  alpha_coul: 10.0
  kspace_accuracy: 1.0e-06
  equil_steps: 10000
  production_steps: 100000
  sample_every: 1000
  estimators:
  - mbar
  - bar
  - ti
  ti_delta: 0.01
  rerun_matrix: true
  keep_trajectories: false
  tail_correction: true
  min_overlap: 0.03
  max_stderr: 0.6
