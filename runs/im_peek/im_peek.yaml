# Benzyltrimethylammonium-functionalised polystyrene: the canonical AEM model
# system. Production-scale settings -- expect hours on a small cluster.
polymer:
  name: Im-PEEK
  # Repeat unit with explicit backbone attachment points.
  smiles: "[*]C1=CC=C(C(C2=CC=C(OC3=C(C[N+]4=CN(C)C=C4)C=C(O[*])C=C3)C=C2)=O)C=C1"
  n_chains: 2
  chain_length: 5
  counterion: "OH-"
  terminal_group: "CH3"

box:
  initial_density: 0.10
  target_density: 1.1
  min_separation: 2.2
  seed: 20260817

md:
  temperature: 300.0
  pressure: 1.0
  timestep: 1.0
  cutoff: 10.0
  soft_push_steps: 20000
  anneal_steps: 50000
  anneal_temperature: 600.0
  compression_steps: 20000
  dry_npt_steps: 200000
  relax_npt_steps: 50000
  dump_every: 1000
  mpi_ranks: 4

equilibration:
  expected_density: 1.1
  density_tolerance: 0.15
  enforce_convergence: false

insertion:
  batch_fraction: 0.50
  batch_size: 50
  min_batch_size: 2
  grid_spacing: 0.5
  probe_radius: 1.4
  max_failed_batches: 3
  max_iterations: 60

widom:
  enabled: true
  n_blocks: 5
  insertions_per_call: 400
  steps_per_block: 10000

water_model: spce
workdir: runs/btma_ps_n8_l20
