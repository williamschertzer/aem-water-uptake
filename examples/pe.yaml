# Benzyltrimethylammonium-functionalised polystyrene: the canonical AEM model
# system. Production-scale settings -- expect hours on a small cluster.
polymer:
  name: PE
  # Repeat unit with explicit backbone attachment points.
  smiles: "[*]CC[*]"
  n_chains: 200
  chain_length: 100
  counterion: "OH-"
  terminal_group: "CH3"

box:
  initial_density: 0.02
  target_density: 0.8
  min_separation: 2.2
  seed: 20260817

md:
  temperature: 300.0
  pressure: 1.0
  timestep: 1.0
  cutoff: 10.0
  soft_push_steps: 20000
  anneal_steps: 50000
  anneal_temperature: 600.0
  compression_steps: 20000
  dry_npt_steps: 200000
  relax_npt_steps: 50000
  dump_every: 1000
  mpi_ranks: 4

equilibration:
  scheme: "21step"
  max_pressure: 50000.0
  high_temperature: 600.0
  time_scale: 1.0
  final_npt_ps: 10.0
  enforce_convergence: false
  expected_density: 0.8
  density_tolerance: 0.5
  drift_tolerance: 0.002

insertion:
  batch_fraction: 0.25
  batch_size: 2
  min_batch_size: 2
  grid_spacing: 0.5
  probe_radius: 1.4
  max_failed_batches: 3
  max_iterations: 12

fep:
  n_morphologies: 1
  lj_lambdas: [0.0, 0.25, 0.5, 0.75, 1.0]
  coul_lambdas: [0.0, 0.5, 1.0]
  equil_steps: 500
  production_steps: 2000
  sample_every: 100
  estimators: [mbar, bar, ti]

  soft_core_n: 1
  alpha_lj: 0.5
  alpha_coul: 10.0
  ti_delta: 0.01
  kspace_accuracy: 1.0e-6

  max_stderr: 5.0
  min_overlap: 0.001
  seed: 90210

water_model: spce
workdir: runs/btma_ps_n8_l20
